paths:
    migrations: %%PHINX_CONFIG_DIR%%/db/voltaredonda/*/migrations

migration_base_class: Classes\PostgresMigration

environments:
    default_migration_table: phinxlog
    default_database: development
    development:
        adapter: pgsql
        host: localhost
        name: ecidade
        user: postgres
        pass: ''
        port: 5432
        charset: latin1

    testing:
        adapter: pgsql
        host: localhost
        name: ecidade
        user: postgres
        pass: ''
        port: 5432
        charset: latin1
